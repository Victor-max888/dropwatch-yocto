name: Build Static Dropwatch (ARM64)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Pure Static Binary (ARM64)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/workspace -w /workspace alpine:latest sh -c "
            apk update && apk add --no-cache \
              build-base autoconf automake libtool pkgconf \
              linux-headers \
              bsd-compat-headers \
              libnl3-dev libnl3-static \
              libpcap-dev \
              readline-dev readline-static \
              ncurses-dev ncurses-static

            ./autogen.sh

            ./configure \
              --without-bfd \
              --enable-static \
              --disable-shared \
              PKG_CONFIG='pkg-config --static'

            # 编译：注入 -no-pie 优先生成传统静态二进制，若编译器坚持 PIE 也能稳定链接
            make -C src dropwatch \
              AM_LDFLAGS='-all-static -static -no-pie' \
              LIBS='\$(pkg-config --static --libs libnl-3.0 libnl-genl-3.0 readline) -lpthread -lncursesw' \
              -j\$(nproc)

            if [ -f src/.libs/dropwatch ]; then
              strip src/.libs/dropwatch
              cp src/.libs/dropwatch /workspace/dropwatch-aarch64-static
            else
              strip src/dropwatch
              cp src/dropwatch /workspace/dropwatch-aarch64-static
            fi
          "

      - name: Verify purely static ELF
        run: |
          file dropwatch-aarch64-static
          
          # 修正断言：兼容传统静态与 static-pie 静态格式
          file dropwatch-aarch64-static | grep -E 'static(-pie)? linked'

          # 确认没有链接任何外部动态解释器
          if strings dropwatch-aarch64-static | grep -E '^/lib/ld-'; then
            echo 'FATAL: Dynamic interpreter detected!'
            exit 1
          fi

          echo 'SUCCESS: Pure static binary confirmed for target execution!'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropwatch-aarch64-static
          path: dropwatch-aarch64-static
